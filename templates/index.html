<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Task Board</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h1 class="h3 text-center fw-bold text-primary mb-4">Dynamic Task Board</h1>
                        <form id="task-form" class="mb-3">
                            <div class="input-group">
                                <input type="text" id="task-input" class="form-control" placeholder="Enter a new task..." maxlength="200" required>
                                <button type="submit" class="btn btn-primary fw-semibold">Add Task</button>
                            </div>
                        </form>
                        <div id="error-alert" class="alert alert-danger d-none py-2" role="alert"></div>
                        <ul id="task-list" class="list-group list-group-flush gap-2"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
