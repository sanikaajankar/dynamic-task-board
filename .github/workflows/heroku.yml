name: Deploy to Heroku

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and verify app imports
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import app; print('Flask app verified successfully')"

      - name: Deploy to Heroku
        if: env.HEROKU_API_KEY != ''
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: "sanika-dynamic-task-board"
          heroku_email: "sanikaajankar@example.com"
